<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Frontend - Nodes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .response-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .response-label {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .response-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            max-height: 300px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-indicator {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-loading {
            background: #d1ecf1;
            color: #0c5460;
        }

        .hidden {
            display: none;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .url-preview {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nodes API Tester</h1>
        <p class="subtitle">Test your /api/v1/nodes endpoint</p>

        <form id="apiForm">
            <div class="form-group">
                <label for="method">HTTP Method</label>
                <select id="method" required>
                    <option value="GET">GET</option>
                    <option value="POST" selected>POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                </select>
            </div>

            <div class="form-group">
                <label for="baseUrl">Base URL</label>
                <input type="text" id="baseUrl" value="http://localhost:8080" placeholder="http://localhost:8080" required>
            </div>

            <div class="form-group">
                <label for="endpoint">Endpoint</label>
                <input type="text" id="endpoint" value="/api/v1/nodes" placeholder="/api/v1/nodes" required>
            </div>

            <div class="form-group">
                <label for="params">Query Parameters</label>
                <textarea id="params" placeholder="descriptionOfTopic="></textarea>
                <div class="url-preview" id="urlPreview"></div>
            </div>

            <div class="form-group">
                <label for="body">Request Body (JSON)</label>
                <textarea id="body" placeholder='Leave empty for empty body'></textarea>
            </div>

            <div class="form-group">
                <label for="headers">Headers (JSON)</label>
                <textarea id="headers" placeholder='{"accept": "*/*"}'></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary" id="sendBtn">Send Request</button>
                <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
            </div>
        </form>

        <div class="response-section hidden" id="responseSection">
            <div class="response-label">Response</div>
            <div id="statusIndicator" class="status-indicator hidden"></div>
            <div id="responseBox" class="response-box"></div>
        </div>
    </div>

    <script>
        const apiForm = document.getElementById('apiForm');
        const methodSelect = document.getElementById('method');
        const baseUrlInput = document.getElementById('baseUrl');
        const endpointInput = document.getElementById('endpoint');
        const paramsInput = document.getElementById('params');
        const bodyInput = document.getElementById('body');
        const headersInput = document.getElementById('headers');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const responseSection = document.getElementById('responseSection');
        const responseBox = document.getElementById('responseBox');
        const statusIndicator = document.getElementById('statusIndicator');
        const urlPreview = document.getElementById('urlPreview');

        // Update URL preview
        function updateUrlPreview() {
            const baseUrl = baseUrlInput.value.trim();
            const endpoint = endpointInput.value.trim();
            const params = paramsInput.value.trim();
            
            let fullUrl = baseUrl + endpoint;
            if (params) {
                fullUrl += '?' + params;
            }
            
            urlPreview.textContent = fullUrl;
        }

        baseUrlInput.addEventListener('input', updateUrlPreview);
        endpointInput.addEventListener('input', updateUrlPreview);
        paramsInput.addEventListener('input', updateUrlPreview);

        // Hide body input for GET and DELETE
        methodSelect.addEventListener('change', () => {
            const method = methodSelect.value;
            bodyInput.parentElement.style.display = ['GET', 'DELETE'].includes(method) ? 'none' : 'block';
        });

        // Send API request
        apiForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const method = methodSelect.value;
            const baseUrl = baseUrlInput.value.trim();
            const endpoint = endpointInput.value.trim();
            const params = paramsInput.value.trim();
            const bodyText = bodyInput.value.trim();
            const headersText = headersInput.value.trim();

            // Build full URL
            let url = baseUrl + endpoint;
            if (params) {
                url += '?' + params;
            }

            // Validate URL
            if (!baseUrl || !endpoint) {
                showError('Please enter base URL and endpoint');
                return;
            }

            // Parse headers
            let headers = {};
            if (headersText) {
                try {
                    headers = JSON.parse(headersText);
                } catch (err) {
                    showError('Invalid JSON in headers');
                    return;
                }
            }

            // Parse body
            let body = null;
            if (bodyText && ['POST', 'PUT', 'PATCH'].includes(method)) {
                try {
                    body = JSON.stringify(JSON.parse(bodyText));
                } catch (err) {
                    // If not valid JSON, send as-is
                    body = bodyText;
                }
            }

            showLoading();

            try {
                const options = {
                    method,
                    headers,
                };

                if (body) {
                    options.body = body;
                }

                const response = await fetch(url, options);
                const contentType = response.headers.get('content-type');
                let data;

                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }

                showSuccess(response.status, data);
            } catch (error) {
                showError(`Request failed: ${error.message}`);
            }
        });

        // Clear form
        clearBtn.addEventListener('click', () => {
            apiForm.reset();
            responseSection.classList.add('hidden');
            updateUrlPreview();
        });

        // Helper functions
        function showLoading() {
            responseSection.classList.remove('hidden');
            statusIndicator.className = 'status-indicator status-loading';
            statusIndicator.classList.remove('hidden');
            statusIndicator.innerHTML = '<span class="loader"></span>Loading...';
            responseBox.textContent = '';
        }

        function showSuccess(statusCode, data) {
            statusIndicator.className = 'status-indicator status-success';
            statusIndicator.classList.remove('hidden');
            statusIndicator.textContent = `✓ ${statusCode} OK`;
            responseBox.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        function showError(message) {
            responseSection.classList.remove('hidden');
            statusIndicator.className = 'status-indicator status-error';
            statusIndicator.classList.remove('hidden');
            statusIndicator.textContent = `✗ Error`;
            responseBox.textContent = message;
        }

        // Initialize
        updateUrlPreview();
    </script>
</body>
</html>
