  let currentData = TEST_DATA; // Start with hard-coded data

  window.addEventListener('DOMContentLoaded', () => {
    renderTree();
  });


    async function submitPrompt() {
      const prompt = document.getElementById('prompt').value;
      if (!prompt.trim()) {
        alert('Please enter a prompt');
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('treeContainer').innerHTML = '';
      document.getElementById('detailsContainer').innerHTML = '';

      try {
        const url = `http://localhost:8080/api/v1/functions?prompt=${encodeURIComponent(prompt)}`;
        const response = await fetch(url, { method: 'POST', body: '' });
        const data = await response.json();
        
        currentData = data;
        selectedId = null;
        renderTree();
      } catch (error) {
        document.getElementById('treeContainer').innerHTML = `<div style="color: red;">Error: ${error.message}</div>`;
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderTree() {
      const container = document.getElementById('treeContainer');
      container.innerHTML = '';
      if (currentData) {
        renderNode(currentData, container, 0);
      }
    }

    function renderNode(node, parentElement, depth) {
      const wrapper = document.createElement('div');
      wrapper.style.marginLeft = (depth * 20) + 'px';

      // Create clickable node
      const nodeDiv = document.createElement('div');
      nodeDiv.style.padding = '3px 5px';
      nodeDiv.style.marginBottom = '2px';
      nodeDiv.style.cursor = 'pointer';
      nodeDiv.style.backgroundColor = selectedId === node.id ? '#4CAF50' : 'transparent';
      nodeDiv.style.color = selectedId === node.id ? 'white' : 'black';
      
      const label = node.name || '(unnamed)';
      const hasChildren = node.helperFunctions && node.helperFunctions.length > 0;
      const arrow = hasChildren ? '▼' : '○';
      
      nodeDiv.innerHTML = `${arrow} <strong>${label}</strong>`;
      nodeDiv.onclick = (e) => {
        e.stopPropagation();
        selectedId = node.id;
        renderTree();
        renderDetails(node);
      };

      wrapper.appendChild(nodeDiv);

      // Render children
      if (hasChildren) {
        const childrenDiv = document.createElement('div');
        node.helperFunctions.forEach(child => {
          renderNode(child, childrenDiv, depth + 1);
        });
        wrapper.appendChild(childrenDiv);
      }

      parentElement.appendChild(wrapper);
    }

    function renderDetails(node) {
      const container = document.getElementById('detailsContainer');
      if (!node) {
        container.innerHTML = 'Select an item from the tree';
        return;
      }

      let html = `<strong>Name:</strong> ${node.name || '(unnamed)'}<br>`;
      html += `<strong>ID:</strong> ${node.id || '(none)'}<br><br>`;
      html += `<strong>Reasoning:</strong><br>`;
      html += `<div style="margin-left: 10px; line-height: 1.6;">${node.Reasoning || '(none)'}</div><br>`;
      html += `<strong>Full JSON:</strong><br>`;
      html += `<pre style="background: #f5f5f5; padding: 10px; overflow-x: auto; max-height: 400px;">${JSON.stringify(node, null, 2)}</pre>`;
      
      container.innerHTML = html;
    }
